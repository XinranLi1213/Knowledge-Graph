<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电子信息工程（培养方案图谱演示）</title><link rel="stylesheet" href="styles/app.css"><script src="vendor/d3.min.js" defer></script><script type="module" src="src/app.js"></script></head>
<body>
<header><a class="brand" href="./" aria-label="专业图谱首页"><span class="brand-icon">✣</span><span>智慧教学中心<small>TEACHING INTELLIGENCE</small></span></a><nav>专业图谱 <span>/</span> <span id="breadcrumb">班级诊断</span></nav><button class="teacher" id="change-role"><i></i><span id="workspace-name">选择工作台</span></button></header>
<main>
<section class="heading"><div><div class="eyebrow">PROGRAM KNOWLEDGE GRAPH <span>2024 培养方案</span></div><h1>电子信息工程<span>培养方案图谱演示</span></h1></div><div class="context"><span id="class-name">电子信息工程演示班</span><div class="identity-controls"><select id="role" aria-label="展示角色"><option value="teacher">教师端</option><option value="student">学生端</option></select><select id="person" aria-label="展示对象"></select><select id="scenario" aria-label="评价场景"><option value="mixed_evidence">阶段性评价</option><option value="knowledge_full">完整知识点评价</option><option value="course_totals_only">仅课程总分</option></select></div></div></section>
<section class="workspace">
<div class="toolbar"><div class="tabs" role="group" aria-label="图谱视图"><button data-mode="structure" class="active">结构拓扑</button><button data-mode="diagnosis">学情诊断</button></div><label class="search">⌕ <input id="search" placeholder="搜索能力、课程或知识点" aria-label="搜索节点"><div id="search-results" role="listbox"></div></label><button id="filters-toggle" aria-expanded="false">☷ 筛选 <span id="filter-count"></span></button><button id="expand">展开知识点</button><button id="toggle-sidebar">画像</button></div>
<div id="filters" hidden><label>培养能力<select id="ability" multiple aria-label="培养能力"></select></label><label>课程群<select id="group" multiple aria-label="课程群"></select></label><label>课程<select id="course" multiple aria-label="课程"></select></label><label>节点状态<select id="health" multiple aria-label="节点状态"><option value="green">掌握较好</option><option value="yellow">需要巩固</option><option value="red">薄弱</option><option value="not_started">未开始</option><option value="no_evidence">待评价</option><option value="insufficient_coverage">证据不足</option></select></label><label>关系<select id="relation" multiple aria-label="关系类型"><option value="supports">支撑</option><option value="belongs_to">归属</option><option value="prerequisite">先修</option><option value="similar">相似</option><option value="parallel">并列</option></select></label><button id="reset">清除筛选</button></div>
<div class="workspace-body"><div id="loading" hidden role="status" aria-live="polite">正在读取评价…</div><section class="canvas-wrap"><div class="canvas-info"><span class="live-dot"></span><span id="visible-count">正在读取图谱…</span><span id="scope-count"></span></div><svg id="graph" role="img" aria-label="三层专业知识图谱"></svg><div id="empty" hidden>没有匹配的节点<button id="empty-reset">清除筛选</button></div><div id="error" hidden role="alert"></div><div class="legend" id="legend"></div><div class="canvas-actions"><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">−</button><button id="fit" aria-label="适应画布">⌖</button><button id="unpin" title="解除所有节点固定">解锁</button></div><div class="canvas-hint">滚轮缩放 · 拖动平移 · 双击节点固定 / 解锁</div></section>
<aside id="sidebar"><div class="aside-empty"><div class="orbit">◎</div><h2>从一个节点开始探索</h2><p>选择能力、课程或知识点<br>查看支撑关系与班级学情</p><div class="overview" id="overview"></div><span class="subtle">预置教学数据</span></div></aside></div>
<footer><span>12 项能力 <b>·</b> 18 门课程 <b>·</b> 108 个知识 / 技能</span><span>节点大小表示同层权重 <b>·</b> 预置教学数据</span></footer>
</section></main><dialog id="entry" aria-labelledby="entry-title"><div class="eyebrow">TEACHING INTELLIGENCE</div><h2 id="entry-title">选择工作台</h2><div class="entry-choices"><button id="enter-teacher"><strong>教师端 →</strong><small>班级概览与学生帮扶</small></button><button id="choose-student"><strong>学生端 →</strong><small>我的技能树与复习建议</small></button></div><div id="identity-step" hidden><label for="entry-student">选择模拟身份</label><select id="entry-student"></select><button id="enter-student">进入我的技能树</button><p class="subtle">演示身份 · 无需验证</p></div></dialog><dialog id="resource-dialog" aria-labelledby="resource-title"><button id="resource-close" aria-label="关闭学习材料">×</button><h2 id="resource-title"></h2><div id="resource-content"></div></dialog></body></html>
